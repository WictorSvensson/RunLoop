# Deploy: manual dispatch only. Builds the image in the cloud, pushes to GHCR,
# then the self-hosted runner on CT 102 pulls and restarts the stack.
#
# Rollback: dispatch again with `ref` set to the previous commit SHA — it
# rebuilds that code and re-tags :latest.
#
# The deploy job is stateless on the server: it copies this repo's
# docker-compose.prod.yml into /opt/runloop and runs compose from there
# (working directory = project directory), so interpolation + env_file both
# read the server-side /opt/runloop/.env (chmod 640, never in git). No
# git/SSH setup needed on the container.
#
# Action versions verified 2026-09-14 (see skill github-actions-versions):
#   actions/checkout v7, actions/setup-node v7,
#   docker/setup-buildx-action v4 @ 37fe631027851001ddb9b187196cc803df7f5f0e
#   docker/login-action     v4 @ dbcb813823bdd20940b903addbd779551569679f
#   docker/build-push-action v7 @ 53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
# (docker/* are SHA-pinned: tags are mutable, SHAs are not.)

name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and deploy"
        required: false
        default: main

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve image tag
        id: meta
        run: echo "image_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kevincutts/runloop:latest
            ghcr.io/kevincutts/runloop:${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux, X64, runloop-prod]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/kevincutts/runloop:${{ needs.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Only the compose file is needed on the server.
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false
      - name: Login to GHCR (private package pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy stack
        run: |
          set -euo pipefail
          cp docker-compose.prod.yml /opt/runloop/docker-compose.prod.yml
          cd /opt/runloop
          TAG='${{ needs.build.outputs.image_tag }}' docker compose -f docker-compose.prod.yml pull app
          TAG='${{ needs.build.outputs.image_tag }}' docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps
      - name: Healthcheck
        run: |
          cd /opt/runloop
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/login; then
              echo "App healthy: $IMAGE"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy; recent logs:"
          docker compose -f /opt/runloop/docker-compose.prod.yml logs --tail=50 app || true
          exit 1
